<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple To‑Do (localStorage)</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--accent:#2b8aef;--done:#28a745}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); margin:0; padding:24px; color:#222}
    .wrap{max-width:720px;margin:0 auto}
    .card{background:var(--card);padding:18px;border-radius:10px;box-shadow:0 6px 20px rgba(16,24,40,.06)}
    h1{margin:0 0 12px;font-size:20px}
    form{display:flex;gap:8px;margin-bottom:12px}
    input[type="text"]{flex:1;padding:10px;border:1px solid #dfe6ee;border-radius:8px;font-size:15px}
    button{background:var(--accent);color:#fff;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid #dfe6ee}
    .controls{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
    .filters{display:flex;gap:6px}
    .filters button{background:#f1f6ff;color:#1a3d7c;border:1px solid #e6f0ff;padding:8px 10px;border-radius:8px;font-size:14px}
    ul{list-style:none;padding:0;margin:0}
    li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;border-bottom:1px solid #f0f3f8}
    li:last-child{border-bottom:none}
    .todo-text{flex:1;word-break:break-word}
    .todo-text.done{color:#777;text-decoration:line-through}
    .small-btn{background:transparent;border:0;color:#666;cursor:pointer;padding:6px;border-radius:6px}
    .small-btn:hover{background:#f3f6fb}
    .meta{font-size:13px;color:#666;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
    .empty{padding:18px;text-align:center;color:#666}
    .undo{background:#fff3cd;color:#856404;border:1px solid #ffeeba;padding:8px 10px;border-radius:8px}
    @media (max-width:520px){form{flex-direction:column} .controls{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Simple To‑Do (saved to your browser)</h1>

      <form id="add-form" autocomplete="off">
        <input id="new-task" type="text" placeholder="Add a task and press Enter" />
        <button id="add-btn" type="submit">Add</button>
      </form>

      <div class="controls">
        <div class="filters" role="tablist" aria-label="Filters">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="active">Active</button>
          <button class="filter" data-filter="completed">Completed</button>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
          <button id="clear-completed" class="ghost">Clear completed</button>
          <button id="clear-all" class="ghost" title="Remove all tasks">Clear all</button>
          <button id="undo-btn" class="undo" title="Undo last delete" style="display:none">Undo</button>
          <button id="export" class="ghost" title="Download JSON">Export</button>
          <button id="import" class="ghost" title="Load JSON">Import</button>
        </div>
      </div>

      <ul id="todo-list" aria-live="polite"></ul>
      <div id="empty-msg" class="empty" hidden>No tasks yet — add one above.</div>

      <div class="meta">
        <div><strong><span id="count">0</span></strong> tasks</div>
        <div style="font-size:13px;color:#666">Stored in localStorage (key: todo-list)</div>
      </div>
    </div>
  </div>

  <input id="import-file" type="file" accept="application/json" style="display:none" />

  <script>
    // Local storage key
    const STORAGE_KEY = 'todo-list';

    // State
    let todos = []; // {id, text, done, createdAt}
    let filter = 'all'; // all | active | completed

    // Undo support
    let lastDeleted = null; // {type: 'single'|'all', items: [...], index: number}
    let undoTimer = null;

    // Elements
    const listEl = document.getElementById('todo-list');
    const newTaskInput = document.getElementById('new-task');
    const addForm = document.getElementById('add-form');
    const countEl = document.getElementById('count');
    const emptyMsg = document.getElementById('empty-msg');
    const filterButtons = document.querySelectorAll('.filter');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const clearAllBtn = document.getElementById('clear-all');
    const undoBtn = document.getElementById('undo-btn');
    const exportBtn = document.getElementById('export');
    const importBtn = document.getElementById('import');
    const importFileInput = document.getElementById('import-file');

    // Helpers
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      render();
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        todos = JSON.parse(raw);
      } catch (e) {
        console.error('Failed to load todos:', e);
        todos = [];
      }
    }

    function addTodo(text) {
      const t = text && text.trim();
      if (!t) return;
      todos.unshift({ id: uid(), text: t, done: false, createdAt: new Date().toISOString() });
      save();
      // adding resets undo
      clearUndo();
    }

    function toggleDone(id) {
      const it = todos.find(x => x.id === id);
      if (it) { it.done = !it.done; save(); }
    }

    function removeFromList(id) {
      const idx = todos.findIndex(x => x.id === id);
      if (idx === -1) return;
      const [removed] = todos.splice(idx, 1);
      // store lastDeleted with index to restore original order
      lastDeleted = { type: 'single', items: [removed], index: idx };
      save();
      showUndo();
    }

    function editTodo(id) {
      const it = todos.find(x => x.id === id);
      if (!it) return;
      const newText = prompt('Edit task', it.text);
      if (newText === null) return; // cancelled
      if (newText.trim() === '') {
        // if emptied, remove
        if (confirm('Empty text — delete task?')) {
          removeFromList(id);
        }
        return;
      }
      it.text = newText.trim();
      save();
      clearUndo();
    }

    function clearCompleted() {
      if (!todos.some(t => t.done)) return alert('No completed tasks.');
      if (!confirm('Remove all completed tasks?')) return;
      // store removed items for undo
      const removed = todos.filter(t => t.done);
      if (removed.length > 0) {
        lastDeleted = { type: 'many', items: removed.map(x => ({...x})), index: null };
      }
      todos = todos.filter(t => !t.done);
      save();
      if (lastDeleted) showUndo();
    }

    function clearAll() {
      if (todos.length === 0) return alert('No tasks to clear.');
      if (!confirm('Remove ALL tasks? This can be undone with Undo for a short time.')) return;
      lastDeleted = { type: 'all', items: todos.map(x => ({...x})), index: null };
      todos = [];
      save();
      showUndo();
    }

    function undoLast() {
      if (!lastDeleted) return alert('Nothing to undo.');
      if (lastDeleted.type === 'single') {
        const item = lastDeleted.items[0];
        const idx = Math.min(lastDeleted.index, todos.length);
        todos.splice(idx, 0, item);
      } else if (lastDeleted.type === 'many' || lastDeleted.type === 'all') {
        // restore by prepending old items while preserving order
        todos = lastDeleted.items.concat(todos);
      }
      lastDeleted = null;
      save();
      hideUndo();
    }

    function clearUndo() {
      lastDeleted = null;
      hideUndo();
    }

    function showUndo() {
      undoBtn.style.display = 'inline-block';
      if (undoTimer) clearTimeout(undoTimer);
      // auto-hide undo after 10 seconds to keep UI simple
      undoTimer = setTimeout(() => { hideUndo(); lastDeleted = null; }, 10000);
    }

    function hideUndo() {
      undoBtn.style.display = 'none';
      if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
    }

    function filteredTodos() {
      if (filter === 'active') return todos.filter(t => !t.done);
      if (filter === 'completed') return todos.filter(t => t.done);
      return todos;
    }

    function render() {
      const items = filteredTodos();
      listEl.innerHTML = '';
      if (items.length === 0) {
        emptyMsg.hidden = false;
      } else {
        emptyMsg.hidden = true;
      }

      for (const t of items) {
        const li = document.createElement('li');

        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = t.done;
        chk.setAttribute('aria-label', 'Mark complete');
        chk.addEventListener('change', () => toggleDone(t.id));
        li.appendChild(chk);

        const span = document.createElement('div');
        span.className = 'todo-text' + (t.done ? ' done' : '');
        span.textContent = t.text;
        span.title = 'Double-click to edit';
        span.addEventListener('dblclick', () => editTodo(t.id));
        li.appendChild(span);

        const created = document.createElement('div');
        created.style.fontSize = '12px';
        created.style.color = '#888';
        created.style.marginRight = '8px';
        created.textContent = (new Date(t.createdAt)).toLocaleString();
        li.appendChild(created);

        const btnEdit = document.createElement('button');
        btnEdit.className = 'small-btn';
        btnEdit.title = 'Edit';
        btnEdit.innerHTML = '✏️';
        btnEdit.addEventListener('click', () => editTodo(t.id));
        li.appendChild(btnEdit);

        const btnDel = document.createElement('button');
        btnDel.className = 'small-btn';
        btnDel.title = 'Delete';
        btnDel.innerHTML = '🗑️';
        btnDel.addEventListener('click', () => {
          if (confirm('Delete this task?')) removeFromList(t.id);
        });
        li.appendChild(btnDel);

        listEl.appendChild(li);
      }

      countEl.textContent = todos.length;
    }

    // Events
    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      addTodo(newTaskInput.value);
      newTaskInput.value = '';
      newTaskInput.focus();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filter = btn.dataset.filter;
        render();
      });
    });

    clearCompletedBtn.addEventListener('click', clearCompleted);
    clearAllBtn.addEventListener('click', clearAll);
    undoBtn.addEventListener('click', undoLast);

    // Export as JSON
    exportBtn.addEventListener('click', () => {
      const data = JSON.stringify(todos, null, 2);
      const blob = new Blob([data], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'todos.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Import JSON file
    importBtn.addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!Array.isArray(parsed)) throw new Error('JSON must be an array of tasks');
          // basic validation: map to our shape
          todos = parsed.map(x => ({
            id: x.id || uid(),
            text: (x.text || '').toString(),
            done: !!x.done,
            createdAt: x.createdAt || new Date().toISOString()
          }));
          save();
          alert('Imported ' + todos.length + ' tasks.');
          clearUndo();
        } catch (err) {
          alert('Failed to import: ' + err.message);
        }
      };
      reader.readAsText(f);
      importFileInput.value = '';
    });

    // Init
    load();
    render();
  </script>
</body>
</html>
