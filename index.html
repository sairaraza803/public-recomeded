<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick and Go - POS System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .search-box {
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 320px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }
        .product-scroll {
            max-height: 440px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .item-card {
            background: white;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .danger-btn {
            background-color: #dc3545;
        }
        .danger-btn:hover {
            background-color: #c82333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
        }
        .total-section {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
        }
        .checkout-btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            font-size: 16px;
        }
        input[type="number"] {
            width: 45px;
            padding: 4px;
            text-align: center;
            margin-right: 5px;
        }

        /* Fixed Print Media Styling */
        @media print {
            body * {
                visibility: hidden;
            }
            #receipt, #receipt * {
                visibility: visible;
            }
            #receipt {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 10px;
                font-size: 14px;
            }
        }

        #receipt {
            display: none;
            font-family: monospace;
            white-space: pre-wrap;
            background: #fff;
            padding: 15px;
            border: 1px dashed #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PICK AND GO - POS System</h2>
    
    <div class="grid">
        <div class="panel">
            <h3>Available Products (100 Items)</h3>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search by product name or ID..." onkeyup="filterProducts()">
            </div>
            <div class="product-scroll" id="product-list">
                </div>
        </div>

        <div class="panel">
            <h3>Shopping Cart</h3>
            <div style="max-height: 380px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>X</th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body">
                        </tbody>
                </table>
            </div>
            
            <div class="total-section">
                Grand Total: Rs. <span id="grand-total">0</span>
            </div>

            <button class="checkout-btn" onclick="checkout()">Print Bill & Checkout</button>
            <button class="checkout-btn danger-btn" onclick="clearCart()" style="margin-top: 5px;">Clear Cart</button>
        </div>
    </div>

    <div id="receipt"></div>
</div>

<script>
    const products = [

        { id: "12", name: "Coriander Powder 200g", price: 140 },
        { id: "13", name: "Salt 800g", price: 50 },

        { id: "16", name: "Green Tea Box", price: 220 },

        { id: "29", name: "Jam Mixed Fruit 450g", price: 350 },
        { id: "30", name: "Peanut Butter 340g", price: 550 },

        { id: "40", name: "Yogurt 1kg", price: 240 },
        { id: "41", name: "Plain Bread Large", price: 170 },
        { id: "42", name: "Milky Rusk Pack", price: 150 },
        { id: "43", name: "Cake Rusk Pack", price: 250 },

        { id: "64", name: "Talcum Powder 200g", price: 300 },

        { id: "83", name: "Cling Film Wrap", price: 200 },
        { id: "84", name: "Sponges Scrub (Pack)", price: 90 },
        { id: "85", name: "Match Box (Bundle)", price: 60 },
        { id: "86", name: "Candles Pack", price: 100 },
        { id: "87", name: "Shoe Polish Black", price: 150 },
        { id: "88", name: "Shoe Brush", price: 120 },
        { id: "89", name: "Phenyl Tablets Pack", price: 100 },
        { id: "90", name: "Air Freshener Spray", price: 420 },
        { id: "91", name: "Baby Diapers Pack", price: 1350 },
        { id: "92", name: "Baby Wipes Pack", price: 250 },
        { id: "93", name: "Baby Powder 200g", price: 320 },
        { id: "94", name: "Baby Soap", price: 130 },
        { id: "95", name: "Baby Feeding Bottle", price: 280 },
        { id: "96", name: "Sanitary Pads Pack", price: 320 },
        { id: "97", name: "First Aid Bandages Pack", price: 80 },
        { id: "98", name: "Antiseptic Liquid 100ml", price: 190 },
        { id: "99", name: "Cotton Roll 100g", price: 140 },
        { id: "100", name: "Pain Relief Balm", price: 150 }
    ];

    let cart = [];

    function loadProducts(itemsToDisplay) {
        const productListEl = document.getElementById("product-list");
        productListEl.innerHTML = "";
        
        itemsToDisplay.forEach(p => {
            productListEl.innerHTML += `
                <div class="item-card">
                    <div>
                        <strong>ID: ${p.id} - ${p.name}</strong><br>
                        Rs. ${p.price}
                    </div>
                    <div>
                        <input type="number" id="qty-${p.id}" value="1" min="1">
                        <button onclick="addToCart('${p.id}')">Add</button>
                    </div>
                </div>
            `;
        });
    }

    function filterProducts() {
        const query = document.getElementById("search-input").value.toLowerCase();
        const filtered = products.filter(p => 
            p.name.toLowerCase().includes(query) || p.id.toLowerCase() === query
        );
        loadProducts(filtered);
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const qtyInput = document.getElementById(`qty-${id}`);
        const quantity = parseInt(qtyInput.value);

        if (isNaN(quantity) || quantity <= 0) {
            alert("Please enter a valid quantity!");
            return;
        }

        const cartItem = cart.find(item => item.id === id);
        if (cartItem) {
            cartItem.quantity += quantity;
        } else {
            cart.push({ id: product.id, name: product.name, price: product.price, quantity: quantity });
        }
        updateCartUI();
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        updateCartUI();
    }

    function updateCartUI() {
        const cartTableBody = document.getElementById("cart-table-body");
        const grandTotalEl = document.getElementById("grand-total");
        cartTableBody.innerHTML = "";

        let grandTotal = 0;
        cart.forEach(item => {
            let itemTotal = item.price * item.quantity;
            grandTotal += itemTotal;
            cartTableBody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>Rs. ${item.price}</td>
                    <td>${item.quantity}</td>
                    <td>Rs. ${itemTotal}</td>
                    <td><button class="danger-btn" onclick="removeFromCart('${item.id}')">X</button></td>
                </tr>
            `;
        });
        grandTotalEl.innerText = grandTotal;
    }

    function clearCart() {
        cart = [];
        updateCartUI();
    }

    function checkout() {
        if (cart.length === 0) {
            alert("Cart is empty!");
            return;
        }

        const now = new Date();
        const dateTimeStr = now.toISOString().slice(0, 19).replace('T', ' ');

        let divider = "==============================";
        let receiptText = divider + "\n";
        receiptText += "          PICK AND GO           \n";
        receiptText += divider + "\n";
        receiptText += `Date/Time: ${dateTimeStr}\n`;
        receiptText += "------------------------------\n";

        let grandTotal = 0;
        cart.forEach(item => {
            let itemTotal = item.price * item.quantity;
            grandTotal += itemTotal;
            receiptText += `${item.name} x ${item.quantity} = Rs. ${itemTotal}\n`;
        });

        receiptText += "------------------------------\n";
        receiptText += `GRAND TOTAL: Rs. ${grandTotal}\n`;
        receiptText += divider + "\n";
        receiptText += "       Thank You for Shopping!\n\n\n";

        // Assign text directly to receipt element before printing
        document.getElementById("receipt").innerText = receiptText;
        
        // Trigger browser print dialog for thermal printer
        window.print();

        // Reset cart after checkout
        cart = [];
        updateCartUI();
    }

    // Initialize on page load
    window.onload = () => loadProducts(products);
</script>

</body>
</html>
